zend_extension=xdebug
xdebug.mode=debug
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300

; OpenTelemetry Configuration
; Enable attribute-based hooks for auto-instrumentation
extension=opentelemetry.so
opentelemetry.attr_hooks_enabled = On

; Simulate shared hosting - disable shell execution functions
#disable_functions = shell_exec,exec,passthru,system,proc_open,popen

; SMTP configuration - route mail through Mailpit
SMTP = mailpit
smtp_port = 1025
sendmail_from = wordpress@localhost
