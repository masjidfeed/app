# Nginx config for the mock Masjid API (DV-04).
# Serves the JSON seed files with CORS + JSON content type so the MAUI app can
# point its base URL at http://localhost:8090 during development.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    default_type application/json;
    charset utf-8;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;

    # Pretty REST-style routes mapped onto the static seed files.
    location = /salahapi { try_files /salahapi.json =404; }
    location = /events { try_files /events.json =404; }
    location = /announcements { try_files /announcements.json =404; }
    location = /config { try_files /config.json =404; }

    # WordPress REST API routes (masjid/v1 namespace) mapped onto the same seed files.
    location = /wp-json/masjid/v1/salahapi { try_files /salahapi.json =404; }
    location = /wp-json/masjid/v1/events { try_files /events.json =404; }
    location = /wp-json/masjid/v1/announcements { try_files /announcements.json =404; }
    location = /wp-json/masjid/v1/config { try_files /config.json =404; }
    location = /wp-json/masjid/v1/parking-config { try_files /parking-config.json =404; }

    location / {
        try_files $uri $uri.json =404;
    }
}
